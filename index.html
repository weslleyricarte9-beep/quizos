<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Descomplica a Sintaxe: Missão das Orações</title>
<style>
:root{--bg1:#0b1646;--bg2:#3a1a78;--card:#ffffff14;--bd:#ffffff2e;--tx:#f4f4ff;--mu:#b9bde6;--y:#ffd23f;--ok:#2ecc8f;--no:#ff6b81;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:17px/1.6 Georgia,"Segoe UI",serif;color:var(--tx);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
main{max-width:860px;margin:auto;padding:18px}
h1,h2,h3{font-family:"Trebuchet MS",system-ui,sans-serif;line-height:1.2}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin:14px 0;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn{font:700 15px "Trebuchet MS",sans-serif;border:0;border-radius:30px;padding:13px 24px;margin:6px 6px 6px 0;cursor:pointer;background:var(--y);color:#1a1450;transition:.2s}
.btn:hover:not(:disabled){transform:scale(1.04)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.s{background:transparent;color:var(--y);border:2px solid var(--y)}
.hero{text-align:center;padding:30px 10px}.hero .ic{font-size:56px}
.hero h1{font-size:clamp(26px,6vw,42px);color:var(--y);margin:6px 0}
.tag{display:inline-block;background:#ffd23f26;color:var(--y);border-radius:20px;padding:3px 12px;font-size:14px;margin:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.bar{height:12px;background:#ffffff26;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),#ff9f43);transition:width .5s}
.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font:600 14px "Trebuchet MS",sans-serif;color:var(--mu)}
.sent{font-size:clamp(19px,4.5vw,24px);background:#0b164699;border-left:5px solid var(--y);padding:14px;border-radius:10px;margin:12px 0}
mark{background:var(--y);color:#1a1450;padding:0 4px;border-radius:5px;font-weight:700}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px;border-radius:12px;border:2px solid var(--bd);background:#ffffff0d;color:var(--tx);font:inherit;font-size:16px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--y)}.opt.sel{border-color:var(--y);background:#ffd23f26}
.opt.right{border-color:var(--ok);background:#2ecc8f33}.opt.wrong{border-color:var(--no);background:#ff6b8133;animation:sh .4s}
.fb{border-radius:14px;padding:16px;margin-top:12px;font-size:16px}.fb.ok{background:#2ecc8f22;border:1px solid var(--ok)}.fb.no{background:#ff6b8122;border:1px solid var(--no)}
.hint{background:#ffd23f1f;padding:10px;border-radius:10px;margin:8px 0;font-size:15px}
table{width:100%;border-collapse:collapse}td{padding:6px;border-bottom:1px solid var(--bd)}
.big{font-size:54px;font-weight:700;color:var(--y);text-align:center;font-family:"Trebuchet MS",sans-serif}
.ex{background:#0b164699;border-radius:10px;padding:10px;margin:8px 0;font-size:16px}
</style></head><body><main id="app"></main>
<script>
const T={
S:["Oração subordinada substantiva subjetiva","funciona como SUJEITO da oração principal. Teste: troque a subordinada por ISSO; se ISSO for o sujeito (“ISSO é necessário”), é subjetiva."],
OD:["Oração subordinada substantiva objetiva direta","funciona como OBJETO DIRETO: completa verbo transitivo direto, sem preposição. Teste: verbo + ISSO (“disse ISSO”)."],
OI:["Oração subordinada substantiva objetiva indireta","funciona como OBJETO INDIRETO: completa verbo que exige preposição (duvidar DE, gostar DE). Teste: verbo + preposição + ISSO."],
CN:["Oração subordinada substantiva completiva nominal","COMPLETA O SENTIDO DE UM NOME (substantivo, adjetivo ou advérbio), sempre com preposição (certeza DE, convencido DE). Teste: pergunte “certeza de quê?”."],
P:["Oração subordinada substantiva predicativa","funciona como PREDICATIVO DO SUJEITO, depois de verbo de ligação (ser). Teste: “O sujeito é ISSO”."],
A:["Oração subordinada substantiva apositiva","funciona como APOSTO: explica ou especifica um termo anterior, em geral depois de dois-pontos ou vírgula."],
R:["Oração subordinada adjetiva restritiva","vem introduzida por PRONOME RELATIVO (que = o qual, onde, cujo, a quem), SEM vírgulas, e restringe o sentido do antecedente, selecionando um grupo."],
E:["Oração subordinada adjetiva explicativa","vem introduzida por pronome relativo e ENTRE VÍRGULAS; apenas acrescenta uma informação que vale para todo o antecedente."]};
const Q=[
["É necessário [[que todos participem da reunião]].","S",["OD","S","P","CN"],1,"Principal: “É necessário”. Subordinada: “que todos participem da reunião”, sujeito de “é necessário” (ISSO é necessário). Pista: verbo ser + adjetivo, sem outro sujeito."],
["A professora disse [[que a prova será adiada]].","OD",["S","OI","A","OD"],1,"Principal: “A professora disse”. A subordinada é objeto direto de “disse” (disse ISSO), sem preposição."],
["Os alunos duvidam [[de que o exame seja fácil]].","OI",["OD","CN","OI","S"],2,"Principal: “Os alunos duvidam”. A subordinada completa “duvidar de” (verbo transitivo indireto): duvidam DE ISSO. Pista: preposição exigida pelo verbo."],
["Tenho a certeza [[de que passarei no concurso]].","CN",["OI","CN","OD","P"],2,"Principal: “Tenho a certeza”. A subordinada completa o substantivo “certeza” (certeza DE QUÊ?). Pista: preposição ligada a um nome."],
["O meu desejo é [[que a paz volte ao mundo]].","P",["S","A","P","CN"],2,"Principal: “O meu desejo é”. A subordinada é predicativo de “desejo” (o desejo é ISSO). Pista: verbo de ligação “ser”."],
["Só lhe peço uma coisa: [[que seja sincero]].","A",["P","OD","A","CN"],2,"Principal: “Só lhe peço uma coisa”. Depois dos dois-pontos, a subordinada especifica “uma coisa”: é aposto."],
["Não sei [[se ele virá à festa]].","OD",["OI","S","OD","CN"],2,"Principal: “Não sei”. “se” é conjunção integrante; a subordinada é objeto direto (não sei ISSO)."],
["Parece [[que vai chover]].","S",["OD","P","S","OI"],2,"Principal: “Parece”. A subordinada é o sujeito (ISSO parece). O verbo não tem outro sujeito."],
["Estou convencido [[de que as reformas trarão benefícios]].","CN",["OI","OD","S","CN"],3,"Principal: “Estou convencido”. A subordinada completa o adjetivo “convencido” (convencido DE ISSO). O termo completado é um nome, não um verbo: completiva nominal."],
["O professor lembrou aos alunos [[que o prazo terminava na sexta]].","OD",["OD","OI","CN","A"],3,"Principal: “O professor lembrou aos alunos”. “aos alunos” é objeto indireto; a subordinada é objeto direto (lembrou ISSO)."],
["A dúvida da turma era [[se o conteúdo cairia na prova]].","P",["CN","P","S","A"],3,"Principal: “A dúvida da turma era”. Sem preposição depois de “era”, a subordinada é predicativa (a dúvida era ISSO)."],
["A esperança [[de que ele volte]] nunca morreu.","CN",["A","S","OI","CN"],3,"Principal: “A esperança … nunca morreu”. A subordinada completa o substantivo “esperança” (esperança DE QUÊ?)."],
["O livro [[que li ontem]] é ótimo.","R",["E","R","OD","S"],1,"Principal: “O livro é ótimo”. “que” = “o qual”, retoma “livro”; sem vírgulas, restringe: indica qual livro."],
["Machado de Assis, [[que nasceu no Rio de Janeiro]], escreveu Dom Casmurro.","E",["R","E","A","OD"],1,"Entre vírgulas, “que nasceu no Rio de Janeiro” só acrescenta informação sobre Machado de Assis, único possível: explicativa."],
["Os alunos [[que estudam]] serão aprovados.","R",["E","OD","R","S"],1,"Sem vírgulas, “que estudam” restringe: só os que estudam serão aprovados. Restritiva."],
["Os alunos, [[que estudam]], serão aprovados.","E",["R","E","OD","S"],2,"Com vírgulas, a oração explica: todos os alunos estudam e serão aprovados. Explicativa. Compare com a anterior: a pontuação muda o sentido."],
["A cidade [[onde nasci]] fica no Maranhão.","R",["E","OI","R","CN"],2,"“onde” é pronome relativo (= na qual) e retoma “cidade”; sem vírgulas, restringe."],
["São Luís, [[onde há muitos casarões históricos]], é patrimônio mundial.","E",["R","E","OD","S"],2,"“onde” retoma “São Luís” (nome único), entre vírgulas: só acrescenta informação — explicativa."],
["O professor [[a quem entreguei o trabalho]] elogiou a turma.","R",["E","OI","R","OD"],2,"“a quem” (= ao qual) retoma “professor”. Sem vírgulas, identifica qual professor: restritiva. Não é objetiva indireta, pois há antecedente retomado."],
["Os livros [[de que preciso]] estão na biblioteca.","R",["OI","CN","R","E"],3,"“de que” = preposição + pronome relativo (dos quais), retomando “livros”. Não é conjunção integrante. Restritiva."],
["Ana, [[cujo irmão é médico]], mudou de cidade.","E",["R","OD","A","E"],3,"“cujo” é pronome relativo possessivo; vírgulas e termo único (Ana) indicam explicativa."],
["Conheci o autor [[cuja obra você comentou]].","R",["E","R","CN","OD"],3,"“cuja” (= de quem) retoma “autor”; sem vírgulas, restringe: restritiva."],
["A notícia [[que recebi]] alegrou todos.","R",["CN","A","R","E"],2,"“que” = “a qual”, retoma “notícia” e é objeto de “recebi”: adjetiva restritiva. Substantivas não retomam antecedente."],
["A notícia [[de que a obra foi concluída]] alegrou todos.","CN",["R","CN","A","OI"],2,"“de que” aqui é preposição + conjunção integrante: a oração completa o substantivo “notícia”. Completiva nominal. Compare com a anterior."],
["Quero [[que você venha]].","OD",["R","S","E","OD"],1,"“Quero ISSO”: “que” é conjunção integrante, sem antecedente; objetiva direta."],
["Era o presente [[que ela queria]].","R",["P","OD","R","A"],3,"“que” = “o qual”, retoma “presente” como objeto de “queria”: adjetiva restritiva (não predicativa)."],
["Meu medo é [[que ela desista]].","P",["R","A","P","S"],3,"“Meu medo é ISSO”: após verbo de ligação, é predicativa; “que” não retoma antecedente."],
["Disseram-me [[que o voo atrasaria]].","OD",["S","R","CN","OD"],3,"“Disseram-me ISSO”: “me” é objeto indireto; a subordinada é objeto direto."],
["Só quero uma coisa: [[que você me escute]].","A",["A","P","OD","R"],3,"Os dois-pontos introduzem a oração que especifica “uma coisa”: apositiva."],
["Pedro, que é meu primo, afirmou [[que viajará amanhã]].","OD",["E","S","R","OD"],3,"“Pedro afirmou ISSO”: objetiva direta. A oração “que é meu primo” é outra, adjetiva explicativa."]];
const MOD=i=>i<12?0:i<22?1:2,MN=["Orações substantivas","Orações adjetivas","Questões comparativas"],LN=["","Nível 1 — Básico","Nível 2 — Intermediário","Nível 3 — Avançado"];
const HINT=["Troque a oração por ISSO e observe se há preposição antes do “que”.","Procure o pronome relativo e veja se há vírgulas.","Teste: o “que” pode ser trocado por “o qual”? Se sim, é adjetiva."];
const L="ABCD",$=s=>document.querySelector(s),app=$("#app");
let st=null,view="home";
const hl=s=>s.replace("[[","<mark>").replace("]]","</mark>");
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function go(v){view=v;render();scrollTo(0,0)}
function start(){st={i:0,a:[],ord:Q.map(q=>shuf(q[2])),sel:null,done:false,hint:false};go("quiz")}
function render(){({home,review,quiz,result,errors})[view]()}
function home(){app.innerHTML=`<div class="card hero"><div class="ic">📚✨</div><h3 style="color:var(--mu)">Descomplica a Sintaxe: Missão das Orações</h3><h1>Desafio das Orações Subordinadas</h1><p>Teste seus conhecimentos, descubra seus erros e domine a sintaxe da Língua Portuguesa.</p><p style="color:var(--mu)">São 30 questões em 3 níveis. Escolha uma alternativa, confirme e receba na hora uma explicação do porquê. Cada acerto vale 10 pontos (máximo 300).</p><span class="tag">🧩 Orações subordinadas substantivas</span><span class="tag">🎯 Orações subordinadas adjetivas</span><p><button class="btn" onclick="start()">INICIAR DESAFIO</button><button class="btn s" onclick="go('review')">REVISAR CONTEÚDOS</button></p></div>`}
function review(){const ex=k=>{const q=Q.find(q=>q[1]==k);return `<div class="ex">${hl(q[0])}<br><small>${q[4]}</small></div>`};
const card=k=>`<div class="card"><h3>${T[k][0]}</h3><p>É a oração que ${T[k][1]}</p>${ex(k)}</div>`;
app.innerHTML=`<h2>📖 Revisão dos conteúdos</h2><div class="card"><h3>Módulo 1 — Orações subordinadas substantivas</h3><p>Exercem as funções que um substantivo exerceria na oração principal (sujeito, objeto, predicativo etc.). Costumam ser introduzidas pelas conjunções integrantes <b>QUE</b> e <b>SE</b>. <b>Estratégia:</b> substitua a oração por <b>ISSO</b>; se a frase continuar fazendo sentido, é substantiva.</p></div><div class="grid">${["S","OD","OI","CN","P","A"].map(card).join("")}</div>
<div class="card"><h3>Módulo 2 — Orações subordinadas adjetivas</h3><p>Funcionam como adjetivos: caracterizam um termo antecedente. São introduzidas por <b>pronomes relativos</b> (que, o qual, quem, cujo, onde). <b>Restritiva:</b> sem vírgulas, delimita o termo. <b>Explicativa:</b> entre vírgulas, só acrescenta informação. A vírgula muda o sentido: “Os alunos que estudam” (só alguns) × “Os alunos, que estudam” (todos).</p></div><div class="grid">${["R","E"].map(card).join("")}</div><button class="btn" onclick="start()">INICIAR DESAFIO</button><button class="btn s" onclick="go('home')">VOLTAR AO INÍCIO</button>`}
function fb(q,ch,ok){const c=q[1];
if(ok)return `<b>🎉 Muito bem! Resposta correta.</b><p><b>${T[c][0]}.</b></p><p>${q[4]}</p><p><b>Como reconhecer:</b> a oração ${T[c][1]}</p>`;
return `<b>Vamos entender seu erro!</b><p>Você marcou <b>${T[ch][0]}</b>. Ela não se aplica aqui. Esse tipo ${T[ch][1]}</p><p><b>Análise desta frase:</b> ${q[4]}</p><p><b>Resposta correta:</b> ${T[c][0]}. A oração ${T[c][1]}</p><p>💡 <b>Dica:</b> aplique o teste do ISSO e, se houver pronome relativo (que = o qual), pense primeiro nas adjetivas. Observe também as vírgulas e as preposições.</p>`}
function quiz(){const i=st.i,q=Q[i],o=st.ord[i],a=st.a[i];
app.innerHTML=`<div class="card"><div class="top"><span>Questão ${i+1}/30 · ${MN[MOD(i)]} · ${LN[q[3]]}</span><span>✅ ${st.a.filter(x=>x.ok).length} · ❌ ${st.a.filter(x=>!x.ok).length} · ⭐ ${st.a.filter(x=>x.ok).length*10} pts</span></div><div class="bar" style="margin:8px 0"><i style="width:${st.a.length/30*100}%"></i></div><small>${st.a.length} respondidas</small>
<div class="sent">${hl(q[0])}</div><p><b>A oração destacada é classificada como:</b></p>
${o.map((k,n)=>`<button class="opt ${a?(k==q[1]?"right":k==a.c?"wrong":""):st.sel==k?"sel":""}" ${a?"disabled":""} onclick="pick('${k}')">${L[n]}) ${T[k][0]}.</button>`).join("")}
${st.hint&&!a?`<div class="hint">💡 ${HINT[MOD(i)]}</div>`:""}
${a?`<div class="fb ${a.ok?"ok":"no"}">${fb(q,a.c,a.ok)}</div><button class="btn" onclick="next()">${i==29?"VER RESULTADO":"PRÓXIMA QUESTÃO"}</button>`:`<button class="btn s" onclick="st.hint=true;quiz()">VER DICA</button><button class="btn" ${st.sel?"":"disabled"} onclick="conf()">CONFIRMAR RESPOSTA</button>`}</div>`}
function pick(k){if(!st.a[st.i]){st.sel=k;quiz()}}
function conf(){const i=st.i;if(st.a[i]||!st.sel)return;st.a[i]={c:st.sel,ok:st.sel==Q[i][1]};quiz()}
function next(){if(st.i==29){go("result");return}st.i++;st.sel=null;st.hint=false;quiz();scrollTo(0,0)}
const pct=(a,b)=>b?Math.round(a/b*100):0;
function grp(f,names){return Object.entries(names).map(([k,n])=>{const ix=Q.map((_,i)=>i).filter(i=>f(i)==k);const h=ix.filter(i=>st.a[i].ok).length;return `<tr><td>${n}</td><td>${h}/${ix.length}</td><td>${pct(h,ix.length)}%</td></tr>`}).join("")}
function result(){const h=st.a.filter(x=>x.ok).length,p=h*10;
const r=p>=260?["🏆 Mestre das Orações","Desempenho brilhante! Você domina a sintaxe das subordinadas."]:p>=200?["🥇 Especialista em Sintaxe","Muito bom! Falta pouco para o domínio completo."]:p>=120?["🔎 Investigador das Orações","Bom caminho! Revisar os erros vai levar você ao próximo nível."]:["🌱 Aprendiz da Sintaxe","Todo mestre começou aqui. Reveja os conteúdos e tente de novo, você vai evoluir!"];
const ms=[0,1,2].map(m=>{const ix=Q.map((_,i)=>i).filter(i=>MOD(i)==m);return [m,pct(ix.filter(i=>st.a[i].ok).length,ix.length)]}).sort((a,b)=>b[1]-a[1]);
const er={};Q.forEach((q,i)=>{if(!st.a[i].ok)er[q[1]]=(er[q[1]]||0)+1});
const w=Object.entries(er).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>T[e[0]][0].replace("Oração subordinada ","").replace("substantiva ","substantivas ").replace("adjetiva ","adjetivas ")+" ("+e[1]+" erro"+(e[1]>1?"s":"")+")");
const an=`Seu melhor desempenho foi em: <b>${MN[ms[0][0]].toLowerCase()}</b> (${ms[0][1]}%).`+(w.length?` Vale revisar: <b>${w.join("; ")}</b>.`:` Você não errou nenhuma questão. Parabéns!`);
app.innerHTML=`<div class="card"><h2 style="text-align:center">Resultado final</h2><div class="big">${p} / 300</div><h2 style="text-align:center">${r[0]}</h2><p style="text-align:center">${r[1]}</p><p style="text-align:center">✅ ${h} acertos · ❌ ${30-h} erros · 📊 ${pct(h,30)}% de aproveitamento</p><div class="bar"><i style="width:${pct(h,30)}%"></i></div></div>
<div class="card"><h3>🧠 Análise personalizada</h3><p>${an}</p></div>
<div class="grid"><div class="card"><h3>Por conteúdo</h3><table>${grp(MOD,{0:MN[0],1:MN[1],2:MN[2]})}</table></div><div class="card"><h3>Por nível</h3><table>${grp(i=>Q[i][3],{1:LN[1],2:LN[2],3:LN[3]})}</table></div></div>
<button class="btn" onclick="go('errors')">REVISAR MEUS ERROS</button><button class="btn s" onclick="start()">REFAZER O QUIZ</button><button class="btn s" onclick="st=null;go('home')">VOLTAR AO INÍCIO</button>`}
function errors(){const by={};Q.forEach((q,i)=>{if(!st.a[i].ok)(by[q[1]]=by[q[1]]||[]).push(i)});
const ks=Object.keys(by);
app.innerHTML=`<h2>🔁 Revisão dos meus erros</h2>${ks.length?ks.map(k=>`<div class="card"><h3>${T[k][0]}</h3>${by[k].map(i=>{const q=Q[i],c=st.a[i].c;return `<div class="ex"><b>Questão ${i+1}:</b> ${hl(q[0])}<br>Você marcou: <b style="color:var(--no)">${T[c][0]}</b><br>Correta: <b style="color:var(--ok)">${T[k][0]}</b><div class="fb no" style="font-size:15px">${fb(q,c,false)}</div></div>`}).join("")}</div>`).join(""):`<div class="card">Nenhum erro para revisar. Parabéns! 🎉</div>`}
<button class="btn s" onclick="go('result')">VOLTAR AO RESULTADO</button><button class="btn" onclick="start()">REFAZER O QUIZ</button>`}
home();
</script></body></html>
